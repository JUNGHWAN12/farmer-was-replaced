<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 허브 · 해양교육 연계 주제탐구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--ink:#0E2A3B;--sub:#33505F;--bg:#F2F6F8;--card:#FFFFFF;--line:#D5E0E6;--teal:#0A5F6B;--teal-soft:#EAF4F5;--navy2:#17405A;--mist:#A9D6DC;--warn:#9A3F06;--warn-soft:#FDF1E8;--ok-bg:#DDEFE6;--ok-fg:#14532D;--mono:'JetBrains Mono',Consolas,'D2Coding',monospace}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
button,select{font-family:inherit}
:focus-visible{outline:3px solid #E08A3C;outline-offset:2px}
header{background:var(--ink);color:#fff;padding:16px 32px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.brand small{display:block;font-size:13px;color:var(--mist);letter-spacing:.04em}
.brand strong{font-size:20px}
.status{display:flex;flex-wrap:wrap;gap:12px}
.pill{background:var(--navy2);border-radius:10px;padding:8px 14px;min-width:120px}
.pill small{display:block;font-size:12px;color:var(--mist)}
.pill b{font-size:15px}
.pill b.mono{font-family:var(--mono)}
nav{background:var(--card);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;flex-wrap:wrap;gap:8px}
nav button{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #B9CAD3;background:#fff;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer}
nav button.done{background:var(--teal-soft)}
nav button[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
nav .sep{align-self:center;color:var(--sub);font-size:13px;padding:0 4px}
.wrap{max-width:1360px;margin:0 auto;padding:28px 32px 56px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
aside{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.card h2{margin:0 0 12px;font-size:18px}
.eyebrow{font-size:13px;font-weight:700;color:var(--teal)}
h1{margin:4px 0 8px;font-size:28px;line-height:1.3}
.goal{margin:0;color:var(--sub);font-size:16px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.checks label{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;cursor:pointer}
.checks input{width:20px;height:20px;flex:none}
.mission{background:var(--card);border:1px solid var(--line);border-radius:14px}
.mission.open{border:2px solid var(--teal)}
.mhead{width:100%;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 24px;background:none;border:0;text-align:left;cursor:pointer;color:inherit;min-height:44px}
.mhead small{display:block;font-size:13px;color:var(--sub)}
.mhead b{font-size:18px}
.badge{font-size:14px;font-weight:700;padding:6px 14px;border-radius:20px;background:#E3ECF0;color:var(--ink)}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg)}
.mbody{padding:0 24px 24px;display:flex;flex-direction:column;gap:14px}
.mbody p{margin:0;color:var(--sub);font-size:15px}
pre{margin:0;background:var(--ink);color:#E6F1F4;border-radius:10px;padding:18px 20px;font-family:var(--mono);font-size:14px;line-height:1.65;overflow-x:auto;tab-size:4}
.row{display:flex;flex-wrap:wrap;gap:12px}
.btn{min-height:48px;padding:0 20px;border-radius:10px;border:1px solid var(--teal);background:#fff;color:var(--teal);font-size:15px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--teal);color:#fff}
.ocean{background:var(--ink);color:#fff;border-color:var(--ink)}
.ocean .eyebrow{color:var(--mist)}
.ocean h2{margin:4px 0 10px}
.ocean p{margin:0 0 8px;color:#E6F1F4;font-size:15px}
.cmds div{margin-bottom:10px;font-size:14px}
.cmds code{display:block;font-family:var(--mono);font-weight:600;color:var(--teal)}
.errs div{margin-bottom:12px;font-size:14px}
.errs b{display:block}
.errs span{color:var(--sub)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.note{background:var(--teal-soft);border-radius:10px;padding:14px 16px;font-size:15px}
footer{max-width:1360px;margin:0 auto;padding:0 32px 32px;color:var(--sub);font-size:13px}
.who{display:flex;gap:8px;align-items:flex-end}
.who>div{display:flex;flex-direction:column;gap:2px}
.who label{font-size:12px;color:var(--mist)}
.who input[readonly]{background:#DCE6EB;color:var(--sub);cursor:default}
.who button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--mist);background:transparent;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.who input{min-height:44px;width:120px;border-radius:8px;border:1px solid #5E8CA0;background:#fff;color:var(--ink);font-size:15px;font-family:inherit;padding:0 12px}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500}
.form input{min-height:44px;border:1px solid #8FA7B3;border-radius:8px;padding:0 12px;font-size:16px;font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:15px;max-width:90vw;z-index:10}
#toast[hidden]{display:none}
@media (max-width:600px){header,nav{padding-left:16px;padding-right:16px}.wrap{padding:20px 16px 40px}footer{padding:0 16px 24px}h1{font-size:23px}}
</style>
</head>
<body>
<header>
  <div class="brand"><small>해양교육 연계 주제탐구 프로그램(프로그래밍)</small><strong>수업 허브</strong></div>
  <div class="status" aria-live="polite">
    <div class="pill"><small id="nowLabel">지금</small><b id="nowText">-</b></div>
    <div class="pill"><small id="leftLabel">남은 시간</small><b class="mono" id="leftText">--:--</b></div>
    <div class="who"><div><label for="sid">학번</label><input id="sid" type="text" inputmode="numeric" placeholder="예: 10305" maxlength="10" autocomplete="off" style="width:96px"></div><div><label for="who">이름</label><input id="who" type="text" placeholder="이름" maxlength="20" autocomplete="off"></div><button type="button" id="whoBtn">저장</button></div>
  </div>
</header>
<nav aria-label="교시 이동" id="tabs"></nav>
<div class="wrap">
  <main id="main"></main>
  <aside id="side"></aside>
</div>
<div id="toast" role="status" hidden></div>
<footer>체크 표시는 이 컴퓨터에 저장되고, 미션 완료·도움 요청·챌린지 기록은 선생님 화면으로 전송됩니다. 다른 컴퓨터에서도 같은 학번·이름을 넣으면 미션 완료 기록을 불러옵니다. 게임: The Farmer Was Replaced</footer>

<script>
const API = "https://script.google.com/macros/s/AKfycbxaqHVYQG-3mlJDU1UUsJRtRRsQfLIe0YklKKGmwSysqdvZlUYOuuBMD9VZhJygAM4k/exec";
const KEY = "daejeong1121";   // Apps Script의 KEY와 같아야 합니다
const MISSIONS = {"1-1": {"title": "첫 명령 실행하기", "need": "명령을 위에서 아래로 한 줄씩 실행합니다. 코드를 복사해 게임 코드 창에 붙여 넣고 실행하세요.", "code": "# ==================================================\n# [1교시] 해양과 알고리즘·자동화 | 미션 1-1 첫 명령\n# 쓸 수 있는 명령: harvest(), do_a_flip()\n# ==================================================\n# 알고리즘 = 문제를 해결하는 정확한 순서\n# 드론은 위에서 아래로 한 줄씩 명령을 실행합니다.\n# 초록색 실행 버튼을 누르고 드론이 무엇을 하는지 보세요.\n\nharvest()     # 드론 아래의 풀을 수확해 건초를 얻습니다\ndo_a_flip()   # 드론이 공중제비를 돕니다\nharvest()\n\n# 생각해 보기\n# - 두 번째 harvest()에서 건초가 늘었나요? 왜 그럴까요?\n# - 해양 쓰레기 수거 로봇이 같은 일을 100번 하려면 명령을 100줄 써야 할까요?"}, "1-2": {"title": "반복으로 자동 수확", "need": "Loops를 해금한 뒤 실행하세요. 멈추려면 정지 버튼을 누릅니다.", "code": "# ==================================================\n# [1교시] 미션 1-2 반복으로 자동 수확\n# 필요한 해금: Loops (건초 5)\n# ==================================================\n# while True: 아래에 들여쓴 줄을 끝없이 반복합니다.\n# 들여쓰기(스페이스 4칸)와 콜론(:)을 꼭 확인하세요.\n# 멈추려면 코드 창의 정지 버튼을 누릅니다.\n\nwhile True:\n    harvest()\n\n# 생각해 보기\n# - 건초가 계속 늘어나나요? 가끔 아무것도 얻지 못하는 때는 언제인가요?\n# - 건초 20개를 모아 Speed를 해금한 뒤 다시 실행해 보세요. 무엇이 달라지나요?"}, "1-3": {"title": "다 자랐을 때만 수확하기", "need": "Speed를 해금하면 쓸 수 있습니다. 확인하고, 판단하고, 행동합니다.", "code": "# ==================================================\n# [1교시] 미션 1-3 다 자랐을 때만 수확하기\n# 필요한 해금: Speed 해금 후 열리는 if, can_harvest()\n# ==================================================\n# 드론이 빨라지자 풀이 다 자라기 전에 수확해서 건초를 못 얻는 일이 생깁니다.\n# can_harvest()는 다 자랐으면 True, 아니면 False를 돌려줍니다.\n# if 조건: 아래 줄은 조건이 True일 때만 실행됩니다.\n\nwhile True:\n    if can_harvest():\n        harvest()\n\n# 해양 연결\n# - 양식장에서도 물고기가 충분히 자랐는지 확인하고 출하합니다.\n#   \"확인 -> 판단 -> 행동\"이 자동화의 기본 순서입니다."}, "2-1": {"title": "한 줄 돌며 일하기", "need": "Expand 1과 Plant를 해금한 뒤 실행하세요. 드론이 제자리에 있으면 North를 East로 바꿉니다.", "code": "# ==================================================\n# [2교시] 순차·반복으로 첫 자동화하기 | 미션 2-1 한 줄 돌며 일하기\n# 필요한 해금: Expand 1 (건초 30) -> move(), Plant (건초 50) -> plant()\n# ==================================================\n# move(North) : 위로 한 칸   move(South) : 아래로 한 칸\n# move(East)  : 오른쪽 한 칸  move(West)  : 왼쪽 한 칸\n# 농장 끝을 넘어가면 반대편으로 돌아옵니다.\n# 덤불(Bush)을 심어 자라면 수확해 나무(Wood)를 얻습니다.\n\nwhile True:\n    if can_harvest():\n        harvest()\n    plant(Entities.Bush)   # 빈 칸이면 덤불을 심고, 이미 자라는 중이면 아무 일도 없음\n    move(North)\n\n# 드론이 제자리에만 있으면 North를 East로 바꿔 보세요.\n\n# 실험해 보기\n# - harvest와 move의 순서를 바꾸면 결과가 어떻게 달라지나요?\n# - 나무 20개를 모아 Expand 2를 해금하면 농장이 넓어집니다. 그다음은 2-2로!"}, "2-2": {"title": "농장 전체를 빠짐없이 돌기", "need": "Expand 2를 해금한 뒤 실행하세요. 오후 활동의 뼈대가 되는 코드이니 꼭 저장합니다.", "code": "# ==================================================\n# [2교시] 미션 2-2 농장 전체를 빠짐없이 돌기\n# 필요한 해금: Expand 2 (나무 20) -> for, range(), get_world_size()\n# ==================================================\n# for i in range(5): 아래 줄을 정확히 5번 반복합니다.\n# get_world_size() : 농장 한 변의 칸 수 (농장이 커지면 저절로 바뀜)\n#\n# 전략: 위로 끝까지 가서 한 열을 처리하면 반대편으로 돌아옵니다.\n#       그다음 오른쪽으로 한 칸 옮겨 다음 열을 처리합니다.\n\nwhile True:\n    for i in range(get_world_size()):        # 열의 개수만큼\n        for j in range(get_world_size()):    # 한 열의 칸 수만큼\n            if can_harvest():\n                harvest()\n            plant(Entities.Bush)\n            move(North)\n        move(East)                           # 다음 열로\n\n# 해양 연결\n# - 해양 쓰레기 수거 로봇도 넓은 해역을 빠짐없이 돌아야 합니다.\n#   한 줄씩 왕복하는 방식이 이 코드와 같은 아이디어입니다.\n# 이 이중 반복은 오늘 오후 모든 활동의 뼈대입니다. 꼭 저장하세요!"}, "3-1": {"title": "땅을 보고 판단하기", "need": "Senses, Operators, Carrots를 해금한 뒤 실행하세요. 흙이 아닐 때만 땅을 갑니다.", "code": "# ==================================================\n# [3교시] 조건문으로 판단하는 드론 만들기 | 미션 3-1 땅을 보고 판단하기\n# 필요한 해금: Senses (건초 100), Operators (건초 150 + 나무 10), Carrots (나무 50)\n# ==================================================\n# get_ground_type() : 드론 아래 땅 종류 (Grounds.Grassland 초원 / Grounds.Soil 흙)\n# till()            : 초원 -> 흙 (이미 흙이면 다시 초원으로 바뀌니 조심!)\n# 당근(Carrot)은 흙에만 심을 수 있습니다.\n# != 는 \"같지 않다\", == 는 \"같다\"입니다.\n\nwhile True:\n    for i in range(get_world_size()):\n        for j in range(get_world_size()):\n            if can_harvest():\n                harvest()\n            if get_ground_type() != Grounds.Soil:   # 흙이 아니면\n                till()                              # 땅을 갈아 흙으로\n            plant(Entities.Carrot)\n            move(North)\n        move(East)\n\n# 생각해 보기\n# - if 줄을 지우고 till()만 남기면 어떤 일이 생길까요? 직접 확인해 보세요."}, "3-2": {"title": "센서 값으로 자동 제어하기", "need": "Watering을 해금한 뒤 실행하세요. 수분이 기준값보다 낮을 때만 물을 줍니다.", "code": "# ==================================================\n# [3교시] 미션 3-2 센서 값으로 자동 제어하기 (스마트 양식장 비유)\n# 필요한 해금: Watering (나무 50)\n# ==================================================\n# get_water() : 드론 아래 땅의 수분 (0 ~ 1)\n# 수분 0이면 1배, 수분 1이면 5배 빨리 자랍니다.\n# 땅은 시간이 지나면 조금씩 마릅니다.\n#\n# 해양 연결: 스마트 양식장은 수온·산소 센서 값이 기준보다 낮아지면\n#            자동으로 산소를 공급합니다. 여기서는 수분 센서가 그 역할입니다.\n\nwhile True:\n    for i in range(get_world_size()):\n        for j in range(get_world_size()):\n            if can_harvest():\n                harvest()\n            if get_ground_type() != Grounds.Soil:\n                till()\n            if get_water() < 0.5:          # 기준값보다 낮으면\n                use_item(Items.Water)      # 물(산소) 공급\n            plant(Entities.Carrot)\n            move(North)\n        move(East)\n\n# 실험해 보기\n# - 기준값 0.5를 0.2나 0.8로 바꾸면 당근 수확과 물 소비가 어떻게 달라질까요?\n#   이 질문이 개인탐구 주제가 될 수 있습니다."}, "4-1": {"title": "좌표 확인하기", "need": "드론이 각 칸의 (x, y)를 보여 줍니다. 활동지 격자에 적어 보세요.", "code": "# ==================================================\n# [4교시] 좌표·변수로 농장 넓히기 | 미션 4-1 좌표 확인하기\n# 필요한 해금: print가 잠겨 있으면 Debug (건초 50 + 나무 50)\n# ==================================================\n# get_pos_x() : 가로 위치 (왼쪽 끝 0, 오른쪽으로 갈수록 커짐)\n# get_pos_y() : 세로 위치 (아래쪽 끝 0, 위로 갈수록 커짐)\n# print(...)  : 드론 위에 연기로 글자를 씁니다 (1초 걸림)\n\nfor i in range(get_world_size()):\n    for j in range(get_world_size()):\n        print(get_pos_x(), get_pos_y())\n        move(North)\n    move(East)\n\n# 활동지 격자에 각 칸의 (x, y)를 적어 보세요.\n# x + y 가 짝수인 칸에 색을 칠하면 어떤 무늬가 나오나요?"}, "4-2": {"title": "간격을 두고 심기", "need": "Trees와 Variables를 해금한 뒤 실행하세요. 나무끼리 맞닿지 않게 체스판으로 심습니다.", "code": "# ==================================================\n# [4교시] 미션 4-2 간격을 두고 심기 (가두리 양식장 간격 비유)\n# 필요한 해금: Trees (나무 50 + 당근 70), Variables (당근 35)\n# ==================================================\n# 나무 규칙: 상하좌우에 나무가 하나 있을 때마다 성장 시간이 2배!\n#            빈틈없이 심으면 2 x 2 x 2 x 2 = 16배 느려집니다.\n# 체스판 무늬로 심으면 나무끼리 맞닿지 않습니다.\n#   (x + y) % 2 == 0  -> 나무\n#   그 밖의 칸        -> 덤불\n# % 는 나눈 나머지입니다. 짝수 % 2 = 0, 홀수 % 2 = 1\n#\n# 해양 연결: 가두리 양식장도 물고기를 너무 빽빽하게 키우면\n#            잘 자라지 못해 간격(사육 밀도)을 설계합니다.\n\nwhile True:\n    n = get_world_size()           # 변수 n에 농장 크기를 저장\n    for i in range(n):\n        for j in range(n):\n            if can_harvest():\n                harvest()\n            if (get_pos_x() + get_pos_y()) % 2 == 0:\n                plant(Entities.Tree)\n            else:\n                plant(Entities.Bush)\n            move(North)\n        move(East)\n\n# Expand 3을 해금해 농장을 넓힌 뒤에도 코드를 고치지 않고 잘 돌아가나요?\n# (확장하면 밭이 초기화되니 자원을 먼저 모아 두세요)"}, "5-1": {"title": "효율 측정하고 개선하기", "need": "그대로 실행해 '개선 전'을 기록한 뒤, 한 가지만 바꿔 다시 측정하세요.", "code": "# ==================================================\n# [5교시] 효율 챌린지: 해양 정화 드론 경로 최적화 | 미션 5-1 효율 측정\n# 필요한 해금: 지금까지의 해금 + (print가 잠겨 있으면 Debug)\n# ==================================================\n# 상황: 드론이 바다 구역(칸)을 돌며 쓰레기(다 자란 당근)를 수거합니다.\n#       드론 배터리는 '행동'을 할 때마다 줄어듭니다.\n#       이동·심기·수확·땅 갈기·물 주기 = 행동 1회 (200틱)\n#       확인만 하는 명령(can_harvest, get_water 등) = 거의 공짜 (1틱)\n#\n# 목표: 같은 바퀴 수 동안 수확은 많이, 행동은 적게!\n#       '행동 1회당 수확량'을 높이는 것이 효율입니다.\n#\n# 측정 순서\n#   1) 이 코드를 그대로 실행 -> 결과를 기록표 '개선 전'에 적기\n#   2) 코드를 한 가지만 바꾸기 -> 다시 실행 -> '개선 후'에 적기\n#   3) 툴팁의 '최근 1분 수확량'도 함께 적기\n#   (작물이 자라는 시간이 매번 조금씩 달라서 결과가 흔들립니다. 2~3번 재 보세요)\n\npasses = 3                              # 농장을 몇 바퀴 돌지\nstart = num_items(Items.Carrot)         # 시작할 때 당근 수\nactions = 0                             # 행동 횟수 세기\n\nfor r in range(passes):\n    for i in range(get_world_size()):\n        for j in range(get_world_size()):\n            if can_harvest():\n                if harvest():\n                    actions += 1\n            if get_ground_type() != Grounds.Soil:\n                till()\n                actions += 1\n            if use_item(Items.Water):       # 개선 포인트: 물을 칸마다 무조건 줍니다\n                actions += 1\n            if plant(Entities.Carrot):\n                actions += 1\n            move(North)\n            actions += 1\n        move(East)\n        actions += 1\n\ngained = num_items(Items.Carrot) - start\nprint(\"수확\", gained, \"행동\", actions)\n\n# 개선 힌트 (하나씩만 바꿔서 비교하세요)\n# - 물을 칸마다 주는 것이 꼭 필요할까요? 수분이 낮을 때만 주면?\n#   (3교시 3-2 코드의 get_water() 조건을 떠올려 보세요)\n# - 기준값을 얼마로 하면 '행동 1회당 수확량'이 가장 높을까요?\n# - passes 를 바꾸면 비교가 공정할까요? 무엇을 똑같이 맞춰야 할까요?"}, "6-1": {"title": "이 코드를 리뷰해 보세요", "need": "작동은 하지만 읽기 어렵고 낭비가 있는 코드입니다. 짝과 함께 고칠 점을 찾으세요.", "code": "# ==================================================\n# [6교시] 코드 리뷰 및 개선 | 미션 6-1 이 코드를 리뷰해 보세요\n# ==================================================\n# 아래 코드는 '작동은 하지만 읽기 어렵고 낭비가 있는' 코드입니다.\n# 짝과 함께 체크리스트로 리뷰하고, 포스트잇에 피드백 2개를 남기세요.\n#\n# 리뷰 체크리스트\n#  [ ] 무엇을 하는 코드인지 한 문장으로 말할 수 있나요?\n#  [ ] 똑같은 계산이나 줄이 여러 번 반복되나요?\n#  [ ] 하지 않아도 되는 행동(낭비)이 있나요?\n#  [ ] 농장이 커져도 그대로 작동하나요?\n#  [ ] 변수 이름이 뜻을 잘 나타내나요?\n\na = get_world_size()\nwhile True:\n    for b in range(a):\n        for c in range(a):\n            if can_harvest():\n                harvest()\n            if (get_pos_x() + get_pos_y()) % 2 == 0:\n                if get_ground_type() != Grounds.Soil:\n                    till()\n                plant(Entities.Tree)\n            if (get_pos_x() + get_pos_y()) % 2 == 1:\n                if get_ground_type() != Grounds.Soil:\n                    till()\n                plant(Entities.Bush)\n            move(North)\n        move(East)"}, "6-2": {"title": "함수로 코드 정리하기", "need": "Functions를 해금한 뒤 실행하세요. 리뷰 결과를 반영해 정리한 코드입니다.", "code": "# ==================================================\n# [6교시] 미션 6-2 함수로 코드 정리하기\n# 필요한 해금: Functions (당근 40)\n# ==================================================\n# def 이름(): 로 여러 줄을 하나의 이름으로 묶습니다.\n# 함수는 '사용하기 전에' 위쪽에서 먼저 정의해야 합니다.\n# 리뷰에서 받은 피드백을 반영해 6-1 코드를 이렇게 바꿀 수 있습니다.\n#  - 나무·덤불은 초원에서도 자라므로 till()이 필요 없음\n#  - 같은 조건을 두 번 계산하던 것을 if / else 하나로\n#  - a, b, c 대신 뜻이 보이는 이름 사용\n\ndef plant_wood():\n    # 체스판 배치: 나무끼리 맞닿지 않게 심기\n    if (get_pos_x() + get_pos_y()) % 2 == 0:\n        plant(Entities.Tree)\n    else:\n        plant(Entities.Bush)\n\ndef tend_tile():\n    # 한 칸에서 할 일: 다 자랐으면 수확하고 다시 심기\n    if can_harvest():\n        harvest()\n    plant_wood()\n\nwhile True:\n    size = get_world_size()\n    for col in range(size):\n        for row in range(size):\n            tend_tile()\n            move(North)\n        move(East)\n\n# 도전\n# - tend_tile()만 바꾸면 당근 농장으로 바꿀 수 있을까요? 직접 바꿔 보세요.\n# - 주석(#)을 달아 짝이 읽기 쉽게 만들어 보세요."}, "7-1": {"title": "탐구 측정 틀 (기본)", "need": "CONDITION 값만 바꿔 가며 같은 시간 동안 측정합니다. tend_tile() 안을 내 주제에 맞게 고치세요.", "code": "# ==================================================\n# [7~8교시] 개인탐구 측정 틀 (기본)\n# 필요한 해금: Functions, Variables, Timing (탐구용 세이브에 포함)\n# ==================================================\n# 사용 방법\n#   1) CONDITION 값만 바꾸며 조건별로 실행합니다. (바꾸는 것 = 조작 변인)\n#   2) 매번 '같은 세이브'를 불러와 같은 상태에서 시작합니다. (통제 변인)\n#   3) 조건마다 3번 이상 실행해 결과를 보고서 기록표에 적습니다.\n#   4) tend_tile() 안을 내 탐구 주제에 맞게 고칩니다.\n#\n# 함수 안에서는 바깥 변수를 바꿀 수 없으므로(global 없음),\n# 행동 횟수는 함수가 return 으로 돌려주고 바깥에서 더합니다.\n\nCONDITION = 0.5            # 조작 변인 (예: 물 주는 기준값)\nDURATION = 60              # 측정 시간(초)\nITEM = Items.Carrot        # 잴 자원 (종속 변인)\n\ndef tend_tile():\n    count = 0                                   # 이 칸에서 한 행동 수\n    if can_harvest():\n        if harvest():\n            count += 1\n    if get_ground_type() != Grounds.Soil:\n        till()\n        count += 1\n    if get_water() < CONDITION:\n        if use_item(Items.Water):\n            count += 1\n    if plant(Entities.Carrot):\n        count += 1\n    return count\n\ndef one_pass():\n    count = 0\n    for i in range(get_world_size()):\n        for j in range(get_world_size()):\n            count += tend_tile()\n            move(North)\n            count += 1\n        move(East)\n        count += 1\n    return count\n\nstart_item = num_items(ITEM)\nstart_time = get_time()\nactions = 0\nwhile get_time() - start_time < DURATION:\n    actions += one_pass()\n\ngained = num_items(ITEM) - start_item\nprint(\"조건\", CONDITION, \"수확\", gained, \"행동\", actions)\nquick_print(\"조건\", CONDITION, \"수확\", gained, \"행동\", actions, \"행동당\", gained / actions)"}, "7-2": {"title": "예시: 스마트 양식 수질 기준값", "need": "기준 수분값을 0.2, 0.5, 0.8로 바꿔 수확량과 물 사용 수를 비교합니다.", "code": "# ==================================================\n# [탐구 예시 1] 스마트 양식장 자동 제어: 기준값을 얼마로 정할까?\n# 탐구 질문: 물 주는 기준 수분값(0.2 / 0.5 / 0.8)에 따라\n#            당근 수확량과 물 소비량은 어떻게 달라질까?\n# 필요한 해금: Functions, Variables, Watering, Timing\n# ==================================================\n# 바꾸는 것(조작 변인): WATER_LIMIT\n# 재는 것(종속 변인)  : 수확량, 물 사용 횟수\n# 같게 둘 것(통제 변인): 세이브, 농장 크기, 측정 시간, 심는 작물\n\nWATER_LIMIT = 0.5          # 0.2, 0.5, 0.8 로 바꿔 가며 실행\nDURATION = 60\n\ndef tend_tile():\n    # 돌려주는 값: (행동 수, 물 사용 수)\n    count = 0\n    water = 0\n    if can_harvest():\n        if harvest():\n            count += 1\n    if get_ground_type() != Grounds.Soil:\n        till()\n        count += 1\n    if get_water() < WATER_LIMIT:\n        if use_item(Items.Water):\n            count += 1\n            water += 1\n    if plant(Entities.Carrot):\n        count += 1\n    return count, water\n\nstart_item = num_items(Items.Carrot)\nstart_time = get_time()\nactions = 0\nwater_used = 0\nwhile get_time() - start_time < DURATION:\n    for i in range(get_world_size()):\n        for j in range(get_world_size()):\n            c, w = tend_tile()\n            actions += c\n            water_used += w\n            move(North)\n            actions += 1\n        move(East)\n        actions += 1\n\ngained = num_items(Items.Carrot) - start_item\nprint(\"기준\", WATER_LIMIT, \"수확\", gained, \"물\", water_used)\nquick_print(\"기준\", WATER_LIMIT, \"수확\", gained, \"물\", water_used, \"행동\", actions)\n\n# 해양 연결 질문: 산소를 많이 넣을수록 항상 좋을까? 비용(물·전기)까지 생각하면?"}, "7-3": {"title": "예시: 양식 밀도와 배치 간격", "need": "LAYOUT을 0과 1로 바꿔 체스판 배치와 빽빽한 배치를 비교합니다.", "code": "# ==================================================\n# [탐구 예시 2] 양식장 밀도: 빽빽하게 vs 간격을 두고\n# 탐구 질문: 나무를 체스판으로 심을 때와 모든 칸에 심을 때\n#            같은 시간 동안 얻는 나무 양은 어떻게 다를까?\n# 필요한 해금: Functions, Variables, Trees, Timing\n# ==================================================\n# 바꾸는 것: LAYOUT  (0 = 체스판, 1 = 모든 칸에 나무)\n# 재는 것  : 나무(Wood) 수확량\n# 같게 둘 것: 세이브, 농장 크기, 측정 시간\n\nLAYOUT = 0\nDURATION = 60\n\ndef plant_by_layout():\n    if LAYOUT == 1:\n        plant(Entities.Tree)\n    elif (get_pos_x() + get_pos_y()) % 2 == 0:\n        plant(Entities.Tree)\n    else:\n        plant(Entities.Bush)\n\ndef tend_tile():\n    if can_harvest():\n        harvest()\n    plant_by_layout()\n\nstart_item = num_items(Items.Wood)\nstart_time = get_time()\nwhile get_time() - start_time < DURATION:\n    for i in range(get_world_size()):\n        for j in range(get_world_size()):\n            tend_tile()\n            move(North)\n        move(East)\n\ngained = num_items(Items.Wood) - start_item\nprint(\"배치\", LAYOUT, \"나무\", gained)\nquick_print(\"배치\", LAYOUT, \"나무\", gained)\n\n# 해양 연결 질문: 양식 밀도를 높이면 마릿수는 늘지만 성장이 느려집니다.\n#                 이 실험 결과는 어떤 밀도가 좋다고 말해 주나요?\n# 주의: 측정 전 농장을 비우고(같은 세이브) 시작해야 공정합니다."}, "7-4": {"title": "예시: 정화 드론 경로 비교", "need": "ROUTE를 0과 1로 바꿔 한 방향 순회와 지그재그 순회의 이동 횟수를 비교합니다.", "code": "# ==================================================\n# [탐구 예시 3] 해양 정화 드론: 어떤 경로가 이동을 줄일까?\n# 탐구 질문: '한 방향 순회'와 '지그재그 순회' 중\n#            모든 구역을 한 번씩 청소하는 데 이동이 더 적은 것은?\n# 필요한 해금: Functions, Variables\n# ==================================================\n# 바꾸는 것: ROUTE (0 = 한 방향, 1 = 지그재그)\n# 재는 것  : 한 바퀴(모든 칸 1회 방문) 동안의 이동 횟수\n# 이 실험은 무작위가 없어 결과가 항상 같습니다.\n# 대신 농장 크기를 바꿔 가며(확장 전후) 비교해 보세요.\n\nROUTE = 0\n\ndef clean_tile():\n    # 쓰레기(다 자란 작물)가 있으면 수거\n    if can_harvest():\n        harvest()\n\ndef sweep_one_way():\n    n = get_world_size()\n    moves = 0\n    for i in range(n):\n        for j in range(n):\n            clean_tile()\n            move(North)        # 끝을 넘으면 아래로 되돌아옴\n            moves += 1\n        move(East)\n        moves += 1\n    return moves\n\ndef sweep_zigzag():\n    n = get_world_size()\n    moves = 0\n    for i in range(n):\n        for j in range(n):\n            clean_tile()\n            if j < n - 1:              # 열의 마지막 칸에서는 위아래로 움직이지 않음\n                if i % 2 == 0:\n                    move(North)\n                else:\n                    move(South)\n                moves += 1\n        if i < n - 1:                  # 마지막 열에서는 옆으로 가지 않음\n            move(East)\n            moves += 1\n    return moves\n\nif ROUTE == 0:\n    total = sweep_one_way()\nelse:\n    total = sweep_zigzag()\nprint(\"경로\", ROUTE, \"이동\", total, \"농장\", get_world_size())\nquick_print(\"경로\", ROUTE, \"이동\", total, \"농장\", get_world_size())\n\n# 해양 연결 질문: 실제 바다에서는 해류와 배터리도 고려해야 합니다.\n#                 게임과 현실은 무엇이 다를까요?"}};

const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem("hub:" + k)); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem("hub:" + k, JSON.stringify(v)); } catch(e){} }
};
let current = null, openMission = null;

let toastTimer = null;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
// 선생님 화면에는 "학번 이름"(예: 10305 홍길동)으로 기록됩니다
function who(){
  const sid = store.get("sid") || "", name = store.get("name") || "";
  return sid && name ? sid + " " + name : "";
}
function send(type, mission, value, extra, okMsg){
  if (!who()){ toast("먼저 위에 학번과 이름을 입력하세요"); (store.get("sid") ? $("#who") : $("#sid")).focus(); return Promise.resolve(false); }
  const item = {type: type, student: who(), mission: mission, value: value, extra: extra || {}};
  // 앞서 못 보낸 기록이 있으면 순서가 섞이지 않게 뒤에 줄 세워 보냅니다
  if ((store.get("outbox") || []).length){
    queue(item); flush();
    toast("인터넷 연결을 기다리는 중이에요. 연결되면 자동으로 보낼게요");
    return Promise.resolve(false);
  }
  return post(item).then(() => {
    if (okMsg) toast(okMsg);
    return true;
  }).catch(err => {
    if (err.message === "rejected"){ toast("기록이 거절되었어요. 선생님께 알려 주세요"); return false; }
    queue(item);
    toast("인터넷이 잠시 끊겼어요. 기록을 보관했다가 연결되면 자동으로 보낼게요");
    return false;
  });
}
function post(item){
  return fetch(API, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({key: KEY}, item))
  }).then(r => r.json()).then(j => { if (!j.ok) throw new Error("rejected"); });
}

// 전송 실패 기록 보관함: 이 컴퓨터에 저장해 두고, 연결되면 순서대로 다시 보냅니다
function queue(item){
  const q = store.get("outbox") || [];
  q.push(item);
  store.set("outbox", q);
}
let flushing = false;
function flush(){
  if (flushing || !(store.get("outbox") || []).length) return;
  flushing = true;
  const next = () => {
    const q = store.get("outbox") || [];
    if (!q.length){ flushing = false; toast("보관해 둔 기록을 모두 보냈어요"); return; }
    return post(q[0]).catch(err => { if (err.message !== "rejected") throw err; })   // 거절된 기록은 버림
      .then(() => { store.set("outbox", (store.get("outbox") || []).slice(1)); return next(); });
  };
  next().catch(() => { flushing = false; });
}

// 진행 상황 복원: 선생님 화면(서버)에 저장된 내 미션 완료 기록을 불러옵니다
function restore(){
  const me = who();
  if (!me) return Promise.resolve();
  return fetch(API + "?key=" + encodeURIComponent(KEY) + "&t=" + Date.now()).then(r => r.json()).then(j => {
    if (!j.ok || who() !== me) return;
    const server = {};
    ((j.data && j.data.progress) || []).forEach(r => { if (String(r[1]) === me) server[r[2]] = r[3] === "done"; });
    (store.get("outbox") || []).forEach(it => { if (it.type === "progress" && it.student === me) server[it.mission] = it.value === "done"; });
    let changed = 0;
    Object.keys(MISSIONS).forEach(m => {
      const local = !!store.get("done:" + m);
      if (m in server){
        if (server[m] !== local){ store.set("done:" + m, server[m]); changed++; }
      } else if (local){
        send("progress", m, "done");   // 이름을 넣기 전에 완료한 미션은 서버에 올림
      }
    });
    if (changed){ render(); toast("저장된 진행 기록을 불러왔어요"); }
  }).catch(() => {});
}

function at(date, hm){ return new Date(date + "T" + hm + ":00+09:00").getTime(); }

function livePeriod(now){
  for (const p of PERIODS) if (now >= at(p.date, p.start) && now < at(p.date, p.end)) return p;
  return null;
}
function nextPeriod(now){
  return PERIODS.find(p => at(p.date, p.start) > now) || null;
}
function fmt(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  if (d > 0) return d + "일 " + h + "시간";
  if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
  return String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
}
function tick(){
  const now = Date.now(), live = livePeriod(now);
  if (live){
    $("#nowLabel").textContent = "지금";
    $("#nowText").textContent = live.tab + " · " + live.start + "~" + live.end;
    $("#leftLabel").textContent = "남은 시간";
    $("#leftText").textContent = fmt(at(live.date, live.end) - now);
  } else {
    const nx = nextPeriod(now);
    $("#nowLabel").textContent = nx ? "다음" : "수업";
    $("#nowText").textContent = nx ? nx.tab + " · " + nx.date.slice(5).replace("-", "/") + " " + nx.start : "모든 차시 종료";
    $("#leftLabel").textContent = nx ? "시작까지" : "";
    $("#leftText").textContent = nx ? fmt(at(nx.date, nx.start) - now) : "수고했어요";
  }
}

function periodDone(p){
  if (!p.missions.length) return false;
  if (p.id === "d23") return false;
  return p.missions.every(m => store.get("done:" + m));
}

function renderTabs(){
  const nav = $("#tabs");
  nav.innerHTML = PERIODS.map((p, i) =>
    (i === 7 ? '<span class="sep" aria-hidden="true">|</span>' : "") +
    '<button type="button" data-id="' + p.id + '"' + (p.id === current ? ' aria-current="true"' : "") +
    (periodDone(p) ? ' class="done"' : "") + ">" + esc(p.tab) + (periodDone(p) ? " 완료" : "") + "</button>").join("");
}

function checklist(group, items, title){
  const saved = store.get("chk:" + group) || [];
  return '<section class="card"><h2>' + esc(title) + '</h2><div class="checks" data-group="' + group + '">' +
    items.map((t, i) => '<label><input type="checkbox"' + (saved[i] ? " checked" : "") + ">" + esc(t) + "</label>").join("") +
    "</div></section>";
}

function missionHtml(id){
  const m = MISSIONS[id], done = !!store.get("done:" + id), open = openMission === id;
  let h = '<section class="mission' + (open ? " open" : "") + '" data-m="' + id + '">' +
    '<button type="button" class="mhead" aria-expanded="' + open + '"><span><small>미션 ' + id + "</small><b>" + esc(m.title) + "</b></span>" +
    '<span class="badge' + (done ? " ok" : "") + '">' + (done ? "완료" : (open ? "진행 중" : "열기")) + "</span></button>";
  if (open){
    h += '<div class="mbody"><p>' + esc(m.need) + "</p><pre><code>" + esc(m.code) + "</code></pre>" +
      '<div class="row"><button type="button" class="btn" data-act="copy">코드 복사</button>' +
      '<button type="button" class="btn primary" data-act="done">' + (done ? "완료 취소" : "미션 완료") + "</button>" +
      '<button type="button" class="btn warn" data-act="help">선생님, 도와주세요</button></div></div>';
  }
  return h + "</section>";
}

function render(){
  const p = PERIODS.find(x => x.id === current);
  renderTabs();
  let h = '<section class="card"><span class="eyebrow">' + esc(p.tab) + " · " + p.date.slice(5).replace("-", "/") + " " + p.start + "~" + p.end +
    "</span><h1>" + esc(p.title) + '</h1><p class="goal">오늘의 목표: ' + esc(p.goal) + "</p></section>";
  if (p.unlocks) h += checklist(p.id + ":unlock", p.unlocks, "먼저 해금하기");
  if (p.todo) h += checklist(p.id + ":todo", p.todo, "할 일");
  if (p.missions.length && (p.id === "p7" || p.id === "d23"))
    h += '<p class="note" style="margin:0">아래는 탐구에 쓸 수 있는 측정 코드입니다. 탐구용 세이브에서 실행하세요.</p>';
  h += p.missions.map(missionHtml).join("");
  if (p.extra) h += p.extra;
  $("#main").innerHTML = h;
  // restore static checklists inside extra
  document.querySelectorAll('#main .checks[data-group="review"] input').forEach((el, i) => {
    el.checked = !!(store.get("chk:review") || [])[i];
  });

  let s = '<section class="card ocean"><span class="eyebrow">바다와 연결하기</span><h2>' + esc(p.ocean.t) + "</h2><p>" + esc(p.ocean.b) +
    "</p><p>생각해 보기: " + esc(p.ocean.q) + "</p></section>";
  if (p.cmds.length) s += '<section class="card cmds"><h2>이번 시간 명령어</h2>' +
    p.cmds.map(c => "<div><code>" + esc(c[0]) + "</code>" + esc(c[1]) + "</div>").join("") + "</section>";
  s += '<section class="card errs"><h2>오류가 났을 때</h2>' +
    ERRORS.map(e => "<div><b>" + esc(e[0]) + "</b><span>" + esc(e[1]) + "</span></div>").join("") + "</section>";
  $("#side").innerHTML = s;
}

function go(id){
  current = id;
  const p = PERIODS.find(x => x.id === id);
  openMission = p.missions.find(m => !store.get("done:" + m)) || p.missions[0] || null;
  store.set("tab", id);
  render();
}

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (b){ go(b.dataset.id); window.scrollTo(0, 0); }
});
$("#main").addEventListener("change", e => {
  const box = e.target.closest(".checks");
  if (!box) return;
  store.set("chk:" + box.dataset.group, [...box.querySelectorAll("input")].map(i => i.checked));
});
$("#main").addEventListener("click", e => {
  const sec = e.target.closest(".mission");
  if (!sec) return;
  const id = sec.dataset.m, act = e.target.closest("[data-act]");
  if (e.target.closest(".mhead")){ openMission = openMission === id ? null : id; render(); return; }
  if (!act) return;
  if (act.dataset.act === "copy"){
    const text = MISSIONS[id].code, btn = act;
    const ok = () => { btn.textContent = "복사했어요"; setTimeout(() => { btn.textContent = "코드 복사"; }, 1500); };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch(err){ btn.textContent = "직접 선택해 복사하세요"; }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }
  if (act.dataset.act === "help"){
    send("help", id, "open", null, "선생님께 도움 요청을 보냈어요");
  }
  if (act.dataset.act === "done"){
    const was = !!store.get("done:" + id);
    store.set("done:" + id, !was);
    send("progress", id, was ? "undone" : "done");
    if (!was){
      const p = PERIODS.find(x => x.id === current);
      openMission = p.missions.find(m => !store.get("done:" + m)) || id;
    }
    render();
  }
});

const sidInput = $("#sid"), nameInput = $("#who"), whoBtn = $("#whoBtn");
sidInput.value = store.get("sid") || "";
nameInput.value = store.get("name") || "";
// 학번·이름 잠금: 저장하면 고정되고, '변경'을 눌러야 고칠 수 있습니다
function lockWho(locked){
  sidInput.readOnly = nameInput.readOnly = locked;
  whoBtn.textContent = locked ? "변경" : "저장";
}
function saveWho(){
  // 학번은 숫자만, 이름은 공백 없이 저장해 같은 학생이 둘로 나뉘지 않게 합니다
  const sid = sidInput.value.replace(/\D/g, ""), name = nameInput.value.replace(/\s/g, "");
  sidInput.value = sid; nameInput.value = name;
  if (!sid){ toast("학번을 숫자로 입력하세요"); sidInput.focus(); return; }
  if (!name){ toast("이름을 입력하세요"); nameInput.focus(); return; }
  const before = who();
  store.set("sid", sid); store.set("name", name);
  lockWho(true);
  const now = who();
  if (now === before) return;
  if (before){
    // 다른 학생으로 바뀌면 이전 학생의 미션 완료 표시를 지우고 새 학생 기록을 불러옴
    Object.keys(MISSIONS).forEach(m => store.set("done:" + m, false));
    render();
  }
  toast(now + " (으)로 저장했어요");
  restore();
}
whoBtn.addEventListener("click", () => {
  if (!sidInput.readOnly){ saveWho(); return; }
  if (!confirm("학번·이름을 바꾸면 선생님 화면에 다른 학생으로 기록됩니다. 바꿀까요?")) return;
  lockWho(false);
  sidInput.focus(); sidInput.select();
});
sidInput.addEventListener("keydown", e => { if (e.key === "Enter" && !sidInput.readOnly) nameInput.focus(); });
nameInput.addEventListener("keydown", e => { if (e.key === "Enter" && !nameInput.readOnly) saveWho(); });
$("#main").addEventListener("submit", e => {
  if (e.target.id !== "chForm") return;
  e.preventDefault();
  const f = new FormData(e.target), v = k => Number(f.get(k));
  const LABEL = {bg: "개선 전 수확", ba: "개선 전 행동", ag: "개선 후 수확", aa: "개선 후 행동"};
  for (const k of ["bg", "ba", "ag", "aa"]){
    const raw = String(f.get(k) || "").trim(), n = Number(raw), bad = msg => { toast(msg); e.target.elements[k].focus(); };
    if (raw === "") return bad(LABEL[k] + " 칸을 채워 주세요");
    if (!Number.isInteger(n) || n < 0) return bad(LABEL[k] + "은 0 이상의 정수로 적어 주세요");
    if ((k === "ba" || k === "aa") && n < 1) return bad("행동 수는 1 이상이어야 해요");
  }
  send("challenge", "5-1", "record", {bg: v("bg"), ba: v("ba"), ag: v("ag"), aa: v("aa")}, "기록을 보냈어요");
});

const live = livePeriod(Date.now());
const saved = store.get("tab");
go(live ? live.id : (PERIODS.some(p => p.id === saved) ? saved : "p1"));
tick(); setInterval(tick, 1000);
lockWho(!!who());
restore();
flush(); setInterval(flush, 10000);
window.addEventListener("online", flush);
</script>
</body>
</html>
